- name: Mail server - Postfix + Dovecot
  hosts: servers
  become: yes

  tasks:
    - name: Install Postfix
      apt:
        name:
          - postfix
          - postfix-mysql
          - swaks
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    # Upstream packages: Debian lags behind (2.3 on 12, 2.4.1 on 13)
    - name: Download the Dovecot repository key
      get_url:
        url: https://repo.dovecot.org/DOVECOT-REPO-GPG-2.4
        dest: /usr/share/keyrings/dovecot.asc
        mode: '0644'

    - name: Read the Dovecot repository key fingerprint
      command: gpg --show-keys --with-colons /usr/share/keyrings/dovecot.asc
      register: dovecot_key
      changed_when: false

    - name: Check it is the key published on dovecot.org/download
      assert:
        that: "'fpr:::::::::EF0882079FD4ED32BF8B23B2A1B09EF84EDC5219:' in dovecot_key.stdout"
        fail_msg: "Unexpected key at repo.dovecot.org: compare with https://www.dovecot.org/download"

    - name: Add the Dovecot repository
      copy:
        dest: /etc/apt/sources.list.d/dovecot.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://repo.dovecot.org/ce-2.4-latest/debian/{{ ansible_distribution_release }}
          Suites: {{ ansible_distribution_release }}
          Components: main
          Signed-By: /usr/share/keyrings/dovecot.asc
      register: dovecot_repo

    - name: Update apt cache
      apt:
        update_cache: yes
      when: dovecot_repo.changed

    - name: Install Dovecot
      apt:
        name:
          - dovecot-core
          - dovecot-mysql
          - dovecot-imapd
          - dovecot-managesieved
          - dovecot-lmtpd
          - dovecot-sieve
          - ssl-cert
        state: present
        install_recommends: no

    - name: Create mail database
      mysql_db:
        name: mailserver
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"

    - name: Create mail database user
      mysql_user:
        user: "{{ mail_db_user }}"
        host: 127.0.0.1
        password: "{{ mail_db_password }}"
        priv: 'mailserver.*:SELECT'
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"

    - name: Create mail database tables
      mysql_query:
        query: "{{ item }}"
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_db: mailserver
      loop:
        - |
          CREATE TABLE IF NOT EXISTS `virtual_domains` (
            `id` int(11) NOT NULL auto_increment,
            `name` varchar(50) NOT NULL,
            PRIMARY KEY (`id`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8;
        - |
          CREATE TABLE IF NOT EXISTS `virtual_users` (
            `id` int(11) NOT NULL auto_increment,
            `domain_id` int(11) NOT NULL,
            `email` varchar(100) NOT NULL,
            `password` varchar(150) NOT NULL,
            `quota` bigint(11) NOT NULL DEFAULT 0,
            PRIMARY KEY (`id`),
            UNIQUE KEY `email` (`email`),
            FOREIGN KEY (domain_id) REFERENCES virtual_domains(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8;
        - |
          CREATE TABLE IF NOT EXISTS `virtual_aliases` (
            `id` int(11) NOT NULL auto_increment,
            `domain_id` int(11) NOT NULL,
            `source` varchar(100) NOT NULL,
            `destination` varchar(100) NOT NULL,
            PRIMARY KEY (`id`),
            FOREIGN KEY (domain_id) REFERENCES virtual_domains(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8;

    - name: Create Postfix MySQL config directory
      file:
        path: /etc/postfix/conf
        state: directory
        mode: '0755'

    - name: Configure Postfix MySQL virtual mailbox domains
      template:
        src: ../templates/etc/postfix/conf/mysql-virtual-mailbox-domains.cf.j2
        dest: /etc/postfix/conf/mysql-virtual-mailbox-domains.cf
        mode: '0640'
        owner: root
        group: postfix

    - name: Configure Postfix MySQL virtual mailbox maps
      template:
        src: ../templates/etc/postfix/conf/mysql-virtual-mailbox-maps.cf.j2
        dest: /etc/postfix/conf/mysql-virtual-mailbox-maps.cf
        mode: '0640'
        owner: root
        group: postfix

    - name: Configure Postfix MySQL virtual alias maps
      template:
        src: ../templates/etc/postfix/conf/mysql-virtual-alias-maps.cf.j2
        dest: /etc/postfix/conf/mysql-virtual-alias-maps.cf
        mode: '0640'
        owner: root
        group: postfix

    - name: Configure Postfix MySQL email2email
      template:
        src: ../templates/etc/postfix/conf/mysql-email2email.cf.j2
        dest: /etc/postfix/conf/mysql-email2email.cf
        mode: '0640'
        owner: root
        group: postfix

    - name: Configure Postfix main.cf
      template:
        src: ../templates/etc/postfix/main.cf.j2
        dest: /etc/postfix/main.cf
        mode: '0644'
      notify: restart postfix

    - name: Configure Postfix master.cf
      template:
        src: ../templates/etc/postfix/master.cf.j2
        dest: /etc/postfix/master.cf
        mode: '0644'
      notify: restart postfix

    - name: Create SNI maps
      template:
        src: ../templates/etc/postfix/sni_maps.j2
        dest: /etc/postfix/sni_maps
        mode: '0644'
      notify: restart postfix

    - name: Generate SNI maps hash
      command: postmap -F hash:/etc/postfix/sni_maps
      notify: restart postfix

    - name: Create vmail group
      group:
        name: vmail
        gid: "{{ vmail_group_id }}"
        state: present

    - name: Create vmail user
      user:
        name: vmail
        uid: "{{ vmail_user_id }}"
        group: vmail
        home: "{{ vmail_home }}"
        create_home: yes
        state: present

    - name: Set vmail directory permissions
      file:
        path: "{{ vmail_home }}"
        state: directory
        owner: vmail
        group: vmail
        recurse: yes

    - name: Configure Dovecot
      include_tasks: tasks/dovecot-config.yml

    - name: Create Certbot renewal hooks directory (Certbot creates it only on first run)
      file:
        path: /etc/letsencrypt/renewal-hooks/post
        state: directory
        mode: '0755'

    - name: Configure certificate renewal hook for mail services
      template:
        src: ../templates/etc/letsencrypt/renewal-hooks/post/restart-mail.sh.j2
        dest: /etc/letsencrypt/renewal-hooks/post/restart-mail.sh
        owner: root
        group: root
        mode: '0755'

  handlers:
    - name: restart postfix
      service:
        name: postfix
        state: restarted

    - name: restart dovecot
      service:
        name: dovecot
        state: restarted
