- name: RSpamD and Redis setup
  hosts: servers
  become: yes

  tasks:
    # Upstream packages: Debian lags far behind (3.4 on 12, 3.12 on 13) and
    # Rspamd does not support them
    - name: Download the RSpamD repository key
      get_url:
        url: https://rspamd.com/apt-stable/gpg.key
        dest: /usr/share/keyrings/rspamd.asc
        mode: '0644'

    - name: Read the RSpamD repository key fingerprint
      command: gpg --show-keys --with-colons /usr/share/keyrings/rspamd.asc
      register: rspamd_key
      changed_when: false

    # Not published on rspamd.com: the Rspamd packages key on keyserver.ubuntu.com since 2015
    - name: Check it is the known RSpamD packages key
      assert:
        that: "'fpr:::::::::3FA347D5E599BE4595CA2576FFA232EDBF21E25E:' in rspamd_key.stdout"
        fail_msg: "Unexpected key at rspamd.com/apt-stable: check it before trusting it"

    - name: Add the RSpamD repository
      copy:
        dest: /etc/apt/sources.list.d/rspamd.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://rspamd.com/apt-stable/
          Suites: {{ ansible_distribution_release }}
          Components: main
          Signed-By: /usr/share/keyrings/rspamd.asc
      register: rspamd_repo

    - name: Update apt cache
      apt:
        update_cache: yes
      when: rspamd_repo.changed

    - name: Install RSpamD and Redis
      apt:
        name:
          - rspamd
          - redis
        state: present
        install_recommends: no

    # Redis background saves fail under memory pressure without it (Redis
    # warns at startup). Debian 13 no longer reads /etc/sysctl.conf.
    - name: Allow memory overcommit for Redis
      copy:
        dest: /etc/sysctl.d/30-redis.conf
        mode: '0644'
        content: |
          vm.overcommit_memory = 1
      register: redis_sysctl

    - name: Apply the Redis kernel setting now
      command: sysctl -p /etc/sysctl.d/30-redis.conf
      when: redis_sysctl.changed

    - name: Configure RSpamD milter headers
      template:
        src: ../templates/etc/rspamd/override.d/milter_headers.conf.j2
        dest: /etc/rspamd/override.d/milter_headers.conf
        mode: '0644'
      notify:
        - restart rspamd
        - restart postfix

    - name: Configure Redis for RSpamD
      template:
        src: ../templates/etc/rspamd/override.d/redis.conf.j2
        dest: /etc/rspamd/override.d/redis.conf
        mode: '0644'
      notify: restart rspamd

    - name: Configure RSpamD Bayes autolearn
      template:
        src: ../templates/etc/rspamd/override.d/classifier-bayes.conf.j2
        dest: /etc/rspamd/override.d/classifier-bayes.conf
        mode: '0644'
      notify: restart rspamd

    - name: Configure DKIM signing in RSpamD
      template:
        src: ../templates/etc/rspamd/local.d/dkim_signing.conf.j2
        dest: /etc/rspamd/local.d/dkim_signing.conf
        mode: '0644'
      notify: restart rspamd

    - name: Create sieve-after directory
      file:
        path: /etc/dovecot/sieve-after
        state: directory
        mode: '0755'

    - name: Create spam-to-folder sieve script
      copy:
        dest: /etc/dovecot/sieve-after/spam-to-folder.sieve
        content: |
          require ["fileinto"];

          if header :contains "X-Spam" "Yes" {
           fileinto "Junk";
           stop;
          }
        mode: '0644'

    - name: Compile spam sieve script
      command: sievec /etc/dovecot/sieve-after/spam-to-folder.sieve

    - name: Create sieve directory
      file:
        path: /etc/dovecot/sieve
        state: directory
        mode: '0755'

    - name: Create learn-spam sieve script
      copy:
        dest: /etc/dovecot/sieve/learn-spam.sieve
        content: |
          require ["vnd.dovecot.pipe", "copy", "imapsieve"];
          pipe :copy "rspamd-learn-spam.sh";
        mode: '0644'

    - name: Create learn-ham sieve script
      copy:
        dest: /etc/dovecot/sieve/learn-ham.sieve
        content: |
          require ["vnd.dovecot.pipe", "copy", "imapsieve", "variables"];
          if string "${mailbox}" "Trash" {
            stop;
          }
          pipe :copy "rspamd-learn-ham.sh";
        mode: '0644'

    - name: Compile sieve learning scripts
      command: "sievec {{ item }}"
      loop:
        - /etc/dovecot/sieve/learn-spam.sieve
        - /etc/dovecot/sieve/learn-ham.sieve

    - name: Create rspamd-learn-spam.sh
      copy:
        dest: /etc/dovecot/sieve/rspamd-learn-spam.sh
        content: |
          #!/bin/sh
          exec /usr/bin/rspamc learn_spam
        owner: vmail
        group: vmail
        mode: '0700'

    - name: Create rspamd-learn-ham.sh
      copy:
        dest: /etc/dovecot/sieve/rspamd-learn-ham.sh
        content: |
          #!/bin/sh
          exec /usr/bin/rspamc learn_ham
        owner: vmail
        group: vmail
        mode: '0700'

    - name: Ensure Redis is enabled and started
      systemd:
        name: redis-server
        enabled: yes
        state: started

    - name: Secure Redis with password
      block:
        - name: Configure Redis password
          lineinfile:
            path: /etc/redis/redis.conf
            regexp: '^#? ?requirepass'
            line: "requirepass {{ redis_password }}"
          notify: restart redis

        - name: Disable Redis CONFIG command
          lineinfile:
            path: /etc/redis/redis.conf
            regexp: '^#? ?rename-command CONFIG'
            line: 'rename-command CONFIG ""'
          notify: restart redis

        - name: Verify Redis password works
          command: "redis-cli -a {{ redis_password }} ping"
          register: redis_ping
          changed_when: false
          failed_when: redis_ping.stdout != "PONG"

  handlers:
    - name: restart rspamd
      service:
        name: rspamd
        state: restarted

    - name: restart postfix
      service:
        name: postfix
        state: restarted

    - name: restart dovecot
      service:
        name: dovecot
        state: restarted

    - name: restart redis
      service:
        name: redis-server
        state: restarted
