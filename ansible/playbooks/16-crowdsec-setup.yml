- name: CrowdSec setup
  hosts: servers
  become: yes

  vars:
    # packagecloud has no trixie dist yet (404): its bookworm packages are
    # static Go binaries and run on Debian 13. Debian's own crowdsec is 1.4.
    crowdsec_repo_release: "{{ 'bookworm' if ansible_distribution_release == 'trixie' else ansible_distribution_release }}"

  tasks:
    - name: Add CrowdSec repository key
      get_url:
        url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
        dest: /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.asc
        mode: '0644'

    - name: Add CrowdSec repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.asc] https://packagecloud.io/crowdsec/crowdsec/debian/ {{ crowdsec_repo_release }} main"
        state: present
        filename: crowdsec_crowdsec

    - name: Install CrowdSec
      apt:
        name: crowdsec
        state: present

    - name: Ensure CrowdSec is running
      systemd:
        name: crowdsec
        enabled: yes
        state: started

    - name: Install Firewall bouncer for UFW
      apt:
        name: crowdsec-firewall-bouncer-iptables
        state: present

    - name: Add UFW bouncer
      command: cscli bouncers add ufw-bouncer
      args:
        creates: /run/.cscli_bouncer_added
      register: bouncer_add
      changed_when: bouncer_add.rc == 0

    - name: Create bouncer flag file
      file:
        path: /run/.cscli_bouncer_added
        state: touch
      when: bouncer_add is changed

    - name: Install CrowdSec collections
      command: "cscli collections install {{ item }}"
      loop:
        - crowdsecurity/sshd
        - crowdsecurity/nginx
        - crowdsecurity/postfix
        - crowdsecurity/dovecot
      register: collections_install
      changed_when: "'installed' in collections_install.stdout or 'already installed' not in collections_install.stdout"
      failed_when: false

    - name: Configure custom whitelist
      file:
        path: /etc/crowdsec/parsers/s02-enrich
        state: directory
        mode: '0755'

    - name: Add whitelist for admin IP
      template:
        src: ../templates/etc/crowdsec/parsers/s02-enrich/custom-whitelist.yaml.j2
        dest: /etc/crowdsec/parsers/s02-enrich/custom-whitelist.yaml
        mode: '0644'
      notify: restart crowdsec

  handlers:
    - name: restart crowdsec
      service:
        name: crowdsec
        state: restarted
